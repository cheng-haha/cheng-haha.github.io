name: Publish legacy GPT-Policy project redirect
on:
  push:
    branches: [main]
    paths:
      - 'legacy-project-redirect/**'
      - '.github/workflows/legacy-project-redirect.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Build compatibility site
        run: |
          mkdir -p _site/GPT-Policy-Eval
          cp legacy-project-redirect/index.html _site/GPT-Policy-Eval/index.html
          cp legacy-project-redirect/index.html _site/404.html
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - uses: actions/deploy-pages@v4
        id: deployment
